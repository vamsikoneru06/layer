name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vash
          POSTGRES_PASSWORD: vash
          POSTGRES_DB: vash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vash:vash@localhost:5432/vash
      APP_ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-used-nowhere-else-0000000000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations apply to real Postgres 17
        run: pnpm db:migrate
      - run: pnpm build

  # The key user journeys in a real browser against a dev server and Postgres (spec §3, apps/web/e2e).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vash
          POSTGRES_PASSWORD: vash
          POSTGRES_DB: vash_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://vash:vash@localhost:5432/vash_e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @vash/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vash/web e2e
      - name: Keep the report and server log when a journey fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            apps/web/e2e/.report/
            apps/web/e2e/.results/
            apps/web/e2e/.server.log
          retention-days: 7
